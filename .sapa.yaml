# Sapa's own gate config. Discovered by walking up from the current directory.
base: main
gate:
  # A step can invoke a skill...
  - name: review
    skill: code-review
  # ...or run a shell command (prefix with a version manager if needed).
  - name: test
    run: python3 tests/test_sapa_section.py && bash tests/test_sapa_config.sh
