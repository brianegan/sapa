# Sapa's own gate config. Discovered by walking up from the current directory.
base: main
# Open PRs ready for review rather than as drafts.
pr: ready
plan: grilling
# Shape the free prose sapa writes (plan comment, PR body, review replies) with a
# skill, run as a final pass before recording. Omit to write plainly.
writing_style: humanizer
# Issue backend. `github` (default) reads issues and records the plan on GitHub;
# `jira` uses the Atlassian CLI (acli) and keeps PRs on GitHub. sapa's own repo
# uses GitHub, so this is left at the default and shown here only as reference:
#   tracker: jira
#   jira:
#     site: verygood-ventures.atlassian.net   # only to build the PR's issue link
#     project: GP                             # lets `sapa start 1` mean GP-1
# How `sapa watch` decides a branch is behind its base.
#   protection (default) — only on mergeStateStatus BEHIND, which needs a
#     "require branches up to date" protection rule.
#   any — also when the base has genuinely moved ahead without that rule
#     (via the compare API), at the cost of a rebase + re-gate on every
#     merge to the base.
# max_ci_fix_attempts (default 3) — how many failed fixes `sapa watch` will push
#   for a CI failure before it stops and escalates instead of pushing another
#   guess. The counter resets to 0 whenever CI goes green again.
# watch:
#   base_behind: protection
#   max_ci_fix_attempts: 3
gate:
  # How many fixes `/sapa-gate` will apply and re-run for one failing gate before
  # it stops and hands the stream back instead of guessing again (default 3).
  # 0 means never autofix. Left at the default here, shown only as reference:
  #   max_fix_attempts: 3
  steps:
    # A step can invoke a skill...
    - name: review
      skill: code-review
      # Pin review to the strongest model; sessions can run cheaper (see PRD).
      model: fable
    # ...or run a shell command (prefix with a version manager if needed). The
    # runner is the only list of test files, so the gate and CI run the same suite.
    - name: test
      run: bash tests/run.sh
