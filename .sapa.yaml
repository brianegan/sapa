# Sapa's own gate config. Discovered by walking up from the current directory.
base: main
# Open PRs ready for review rather than as drafts.
pr: ready
plan: grill-with-docs
# How `sapa watch` decides a branch is behind its base.
#   protection (default) — only on mergeStateStatus BEHIND, which needs a
#     "require branches up to date" protection rule.
#   any — also when the base has genuinely moved ahead without that rule
#     (via the compare API), at the cost of a rebase + re-gate on every
#     merge to the base.
# watch:
#   base_behind: protection
gate:
  # A step can invoke a skill...
  - name: review
    skill: code-review
    # Pin review to the strongest model; sessions can run cheaper (see PRD).
    model: fable
  # ...or run a shell command (prefix with a version manager if needed).
  - name: test
    run: bash tests/test_sapa_dispatch.sh && python3 tests/test_sapa_section.py && python3 tests/test_sapa_watch.py && python3 tests/test_sapa_status.py && python3 tests/test_skill_lint.py && bash tests/test_sapa_config.sh && bash tests/test_sapa_tmp.sh && bash tests/test_sapa_install.sh && bash tests/test_sapa_uninstall.sh && bash tests/test_sapa_completion.sh
