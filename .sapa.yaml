# Sapa's own gate config. Discovered by walking up from the current directory.
base: main
# Open PRs ready for review rather than as drafts.
pr: ready
gate:
  # A step can invoke a skill...
  - name: review
    skill: code-review
  # ...or run a shell command (prefix with a version manager if needed).
  - name: test
    run: bash tests/test_sapa_dispatch.sh && python3 tests/test_sapa_section.py && python3 tests/test_sapa_watch.py && bash tests/test_sapa_config.sh && bash tests/test_sapa_install.sh && bash tests/test_sapa_completion.sh
